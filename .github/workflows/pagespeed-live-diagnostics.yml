name: CounselO live Lighthouse diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pagespeed-live-diagnostics.yml"
      - "artifacts/legal-site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Capture live HTML and asset inventory
        shell: bash
        run: |
          curl --fail --silent --show-error --compressed \
            -H 'Cache-Control: no-cache' \
            'https://counselo-legal.com/?diagnostic=20260829' \
            -o live-root.html
          grep -oE '/assets/[^" ]+\.(js|css)' live-root.html | sort -u > live-assets.txt || true
          grep -oE 'data-ssr(-url)?="[^"]*"' live-root.html > live-ssr-markers.txt || true
          wc -c live-root.html
          cat live-assets.txt
          cat live-ssr-markers.txt

      - name: Run live desktop Lighthouse diagnostics
        shell: bash
        run: |
          npx --yes lighthouse@13.4.1 'https://counselo-legal.com/?diagnostic=20260829' \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --throttling-method=devtools \
            --throttling.rttMs=150 \
            --throttling.throughputKbps=1600 \
            --throttling.cpuSlowdownMultiplier=1 \
            --screenEmulation.width=1350 \
            --screenEmulation.height=940 \
            --screenEmulation.deviceScaleFactor=1 \
            --screenEmulation.mobile=false \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage --disable-cache' \
            --output=json \
            --output-path=lighthouse-live-desktop.json \
            --quiet

          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('lighthouse-live-desktop.json', 'utf8'));
          const a = report.audits;
          const pick = (id) => a[id]?.details?.items ?? [];
          const summary = {
            finalUrl: report.finalDisplayedUrl,
            fetchTime: report.fetchTime,
            lighthouseVersion: report.lighthouseVersion,
            userAgent: report.configSettings?.emulatedUserAgent,
            screenEmulation: report.configSettings?.screenEmulation,
            performance: report.categories.performance?.score,
            accessibility: report.categories.accessibility?.score,
            bestPractices: report.categories['best-practices']?.score,
            seo: report.categories.seo?.score,
            fcp: a['first-contentful-paint']?.displayValue,
            lcp: a['largest-contentful-paint']?.displayValue,
            tbt: a['total-blocking-time']?.displayValue,
            cls: a['cumulative-layout-shift']?.displayValue,
            speedIndex: a['speed-index']?.displayValue,
            shiftElements: pick('layout-shift-elements'),
            shiftEvents: pick('layout-shifts'),
            layoutShiftCulprits: pick('layout-shift-insight'),
            lcpBreakdown: pick('lcp-breakdown-insight'),
            lcpDiscovery: pick('lcp-discovery-insight'),
            imageDelivery: pick('image-delivery-insight'),
            forcedReflow: pick('forced-reflow-insight'),
            renderBlocking: pick('render-blocking-insight'),
            networkDependencyTree: pick('network-dependency-tree-insight'),
            unusedJavaScript: pick('unused-javascript'),
            fontDisplay: pick('font-display'),
          };
          fs.writeFileSync('lighthouse-live-desktop-summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counselo-live-lighthouse
          path: |
            live-root.html
            live-assets.txt
            live-ssr-markers.txt
            lighthouse-live-desktop.json
            lighthouse-live-desktop-summary.json
