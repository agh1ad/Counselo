name: Finalize CounselO PR51

on:
  push:
    branches:
      - perf/cls-complete-zero-visual-20260829
    paths:
      - ".github/workflows/finalize-pr51.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/cls-complete-zero-visual-20260829
          fetch-depth: 0

      - name: Apply final performance and accessibility corrections
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("artifacts/legal-site")

          for rel in ["src/pages/region-picker.tsx", "src/pages/ar-region-picker.tsx"]:
              path = root / rel
              source = path.read_text()
              old_logo = 'const counseloLogo2x = "/images/optimized/counselo-region-logo-386.webp";'
              new_logo = 'const counseloLogoRetina = "/images/optimized/counselo-region-logo-310.webp";'
              if old_logo not in source:
                  raise SystemExit(f"Expected logo constant missing from {rel}")
              source = source.replace(old_logo, new_logo, 1)

              old_srcset = 'srcSet={`${counseloLogo} 1x, ${counseloLogo2x} 2x`}'
              new_srcset = 'srcSet={`${counseloLogo} 193w, ${counseloLogoRetina} 310w`}\n                sizes="(min-width: 640px) 154px, 135px"'
              if old_srcset not in source:
                  raise SystemExit(f"Expected logo srcSet missing from {rel}")
              source = source.replace(old_srcset, new_srcset, 1)

              if rel.endswith("ar-region-picker.tsx"):
                  old_number = '<span aria-hidden="true" className={`font-serif text-5xl ${dark ? "text-white/15" : "text-[#0d4a31]/12"}`}>{number}</span>'
                  new_number = "\n".join([
                      '<span',
                      '                        aria-hidden="true"',
                      '                        data-number={number}',
                      '                        className={`region-card-number font-serif text-5xl ${dark ? "region-card-number--dark" : "region-card-number--light"}`}',
                      '                      />',
                  ])
              else:
                  old_number = '<span aria-hidden="true" className={`font-serif text-5xl italic ${dark ? "text-white/15" : "text-[#0d4a31]/12"}`}>{number}</span>'
                  new_number = "\n".join([
                      '<span',
                      '                        aria-hidden="true"',
                      '                        data-number={number}',
                      '                        className={`region-card-number font-serif text-5xl italic ${dark ? "region-card-number--dark" : "region-card-number--light"}`}',
                      '                      />',
                  ])
              if old_number not in source:
                  raise SystemExit(f"Expected decorative number missing from {rel}")
              source = source.replace(old_number, new_number, 1)
              path.write_text(source)

          css_path = root / "src/index.css"
          css = css_path.read_text()
          marker = "\n".join([
              "",
              ".region-card-number::before {",
              "  content: attr(data-number);",
              "}",
              "",
              ".region-card-number--dark::before {",
              "  color: rgb(255 255 255 / 0.15);",
              "}",
              "",
              ".region-card-number--light::before {",
              "  color: rgb(13 74 49 / 0.12);",
              "}",
          ])
          if ".region-card-number::before" not in css:
              anchor = "\n.counselo-gold-rule"
              if anchor not in css:
                  raise SystemExit("CSS insertion anchor missing")
              css = css.replace(anchor, marker + anchor, 1)
          css_path.write_text(css)

          prerender_path = root / "src/scripts/prerender.ts"
          prerender = prerender_path.read_text()
          start_marker = 'const PICKER_ROUTES = new Set(["/", "/ar"]);'
          end_marker = "\nfunction inlinePickerStyles"
          start = prerender.find(start_marker)
          end = prerender.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Picker resource-hint block missing")
          replacement = "\n".join([
              'const PICKER_ROUTES = new Set(["/", "/ar"]);',
              "",
              'function pickerResourceHints(route: string): string {',
              '  if (!PICKER_ROUTES.has(route)) return "";',
              "",
              "  return [",
              "    '<link rel=\"preload\" as=\"image\" href=\"/images/optimized/counselo-region-logo-193.webp\" imagesrcset=\"/images/optimized/counselo-region-logo-193.webp 193w, /images/optimized/counselo-region-logo-310.webp 310w\" imagesizes=\"(min-width: 640px) 154px, 135px\" type=\"image/webp\" fetchpriority=\"high\">',",
              "    '<link rel=\"preload\" as=\"image\" href=\"/images/optimized/counselo-platform-line-art-v1.webp\" type=\"image/webp\" media=\"(min-width: 1024px)\" fetchpriority=\"high\">',",
              '  ].join("");',
              "}",
              "",
          ])
          prerender = prerender[:start] + replacement + prerender[end:]
          prerender_path.write_text(prerender)

          source_image = root / "public/images/optimized/counselo-region-logo.png"
          output_image = root / "public/images/optimized/counselo-region-logo-310.webp"
          with Image.open(source_image) as image:
              image.resize((310, 128), Image.Resampling.LANCZOS).save(
                  output_image,
                  format="WEBP",
                  quality=95,
                  method=6,
              )
          if output_image.stat().st_size >= 30000:
              raise SystemExit("Responsive logo exceeded 30 KB")
          PY

          rm -f artifacts/legal-site/public/images/optimized/counselo-region-logo-386.webp
          rm -f .github/workflows/export-pr51-source.yml
          rm -f .github/workflows/finalize-pr51.yml

          git diff --check
          git status --short

      - name: Commit final branch state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: finalize stable picker delivery"
          git push origin HEAD:perf/cls-complete-zero-visual-20260829
