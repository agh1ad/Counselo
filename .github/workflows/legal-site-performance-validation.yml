name: Legal site performance validation

on:
  pull_request:
    paths:
      - "artifacts/legal-site/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/legal-site-performance-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck legal site
        run: pnpm --filter @workspace/legal-site run typecheck

      - name: Test legal site
        run: pnpm --filter @workspace/legal-site run test

      - name: Build complete production site
        run: pnpm --filter @workspace/legal-site run build

      - name: Start and smoke test production server
        shell: bash
        run: |
          PORT=24438 NODE_ENV=production nohup node artifacts/legal-site/dist/ssr-server.mjs > /tmp/counselo-server.log 2>&1 &
          echo $! > /tmp/counselo-server.pid
          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:24438/ > /tmp/counselo-root.html; then
              break
            fi
            if ! kill -0 "$(cat /tmp/counselo-server.pid)" 2>/dev/null; then
              cat /tmp/counselo-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:24438/ar > /tmp/counselo-ar.html
          curl --fail --silent --show-error http://127.0.0.1:24438/sa > /tmp/counselo-sa.html
          grep -q 'id="root"' /tmp/counselo-root.html
          grep -q 'CounselO' /tmp/counselo-root.html
          grep -q 'data-picker-critical-css' /tmp/counselo-root.html
          grep -q 'counselo-platform-line-art-v1.webp' /tmp/counselo-root.html
          grep -q 'counselo-region-logo-193.webp' /tmp/counselo-root.html
          grep -q 'data-picker-critical-css' /tmp/counselo-ar.html
          if grep -q 'fonts.googleapis.com\|fonts.gstatic.com' /tmp/counselo-root.html /tmp/counselo-ar.html; then
            echo "External Google Fonts remained in a picker page"
            exit 1
          fi
          if grep -q 'googletagmanager.com/gtag/js' /tmp/counselo-root.html /tmp/counselo-ar.html; then
            echo "Duplicate direct GA runtime remained in a picker page"
            exit 1
          fi

      - name: Desktop Lighthouse diagnostics
        shell: bash
        run: |
          npx --yes lighthouse@13.0.1 http://127.0.0.1:24438/ \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --throttling-method=simulate \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=lighthouse-desktop.json \
            --quiet

      - name: Mobile Lighthouse diagnostics
        shell: bash
        run: |
          npx --yes lighthouse@13.0.1 http://127.0.0.1:24438/ \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --only-categories=performance,accessibility,best-practices,seo \
            --throttling-method=simulate \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=lighthouse-mobile.json \
            --quiet

      - name: Enforce Lighthouse stability and quality gates
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const auditIds = [
            'first-contentful-paint',
            'largest-contentful-paint',
            'speed-index',
            'total-blocking-time',
            'cumulative-layout-shift',
            'layout-shifts',
            'layout-shift-elements',
            'cls-culprits-insight',
            'largest-contentful-paint-element',
            'lcp-discovery-insight',
            'image-delivery-insight',
            'render-blocking-insight',
            'forced-reflow-insight',
            'unused-javascript',
            'long-tasks',
          ];
          const result = {};
          const failures = [];
          for (const [name, file] of [['desktop', 'lighthouse-desktop.json'], ['mobile', 'lighthouse-mobile.json']]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const categories = report.categories;
            const audits = {};
            for (const id of auditIds) {
              const audit = report.audits[id];
              if (!audit) continue;
              audits[id] = {
                score: audit.score,
                displayValue: audit.displayValue,
                numericValue: audit.numericValue,
                details: audit.details,
              };
            }
            result[name] = {
              scores: {
                performance: categories.performance.score,
                accessibility: categories.accessibility.score,
                bestPractices: categories['best-practices'].score,
                seo: categories.seo.score,
              },
              audits,
            };
          }

          const check = (condition, message) => { if (!condition) failures.push(message); };
          const d = result.desktop;
          const m = result.mobile;
          check(d.scores.performance >= 0.95, `Desktop performance ${d.scores.performance} < 0.95`);
          check(m.scores.performance >= 0.90, `Mobile performance ${m.scores.performance} < 0.90`);
          check(d.scores.accessibility >= 0.99, `Desktop accessibility ${d.scores.accessibility} < 0.99`);
          check(m.scores.accessibility >= 0.99, `Mobile accessibility ${m.scores.accessibility} < 0.99`);
          check(d.scores.bestPractices === 1 && m.scores.bestPractices === 1, 'Best Practices must remain 100');
          check(d.scores.seo === 1 && m.scores.seo === 1, 'SEO must remain 100');
          check((d.audits['cumulative-layout-shift']?.numericValue ?? 1) <= 0.02, 'Desktop CLS exceeded 0.02');
          check((m.audits['cumulative-layout-shift']?.numericValue ?? 1) <= 0.02, 'Mobile CLS exceeded 0.02');
          check((d.audits['largest-contentful-paint']?.numericValue ?? Infinity) <= 2500, 'Desktop LCP exceeded 2.5 s');
          check((m.audits['largest-contentful-paint']?.numericValue ?? Infinity) <= 3000, 'Mobile LCP exceeded 3.0 s');
          check((d.audits['total-blocking-time']?.numericValue ?? Infinity) <= 200, 'Desktop TBT exceeded 200 ms');
          check((m.audits['total-blocking-time']?.numericValue ?? Infinity) <= 200, 'Mobile TBT exceeded 200 ms');
          for (const name of ['desktop', 'mobile']) {
            for (const id of ['lcp-discovery-insight', 'render-blocking-insight']) {
              const score = result[name].audits[id]?.score;
              check(score === null || score === undefined || score === 1, `${name} ${id} still reports an actionable issue`);
            }
          }

          fs.writeFileSync('lighthouse-summary.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify({
            desktop: {
              scores: d.scores,
              fcp: d.audits['first-contentful-paint']?.displayValue,
              lcp: d.audits['largest-contentful-paint']?.displayValue,
              speedIndex: d.audits['speed-index']?.displayValue,
              tbt: d.audits['total-blocking-time']?.displayValue,
              cls: d.audits['cumulative-layout-shift']?.displayValue,
            },
            mobile: {
              scores: m.scores,
              fcp: m.audits['first-contentful-paint']?.displayValue,
              lcp: m.audits['largest-contentful-paint']?.displayValue,
              speedIndex: m.audits['speed-index']?.displayValue,
              tbt: m.audits['total-blocking-time']?.displayValue,
              cls: m.audits['cumulative-layout-shift']?.displayValue,
            },
          }, null, 2));
          if (failures.length) {
            console.error(`Performance validation failed:\n- ${failures.join('\n- ')}`);
            process.exit(1);
          }
          NODE

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-site-lighthouse
          path: |
            lighthouse-desktop.json
            lighthouse-mobile.json
            lighthouse-summary.json
          if-no-files-found: warn
