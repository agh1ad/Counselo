name: Check existing Replit deployment credentials

on:
  push:
    branches:
      - verify/live-counselo-20260829
    paths:
      - ".github/workflows/verify-live-counselo.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPLIT_TOKEN_VALUE: ${{ secrets.REPLIT_TOKEN }}
      REPLIT_API_TOKEN_VALUE: ${{ secrets.REPLIT_API_TOKEN }}
      REPLIT_AUTH_TOKEN_VALUE: ${{ secrets.REPLIT_AUTH_TOKEN }}
      REPLIT_DEPLOYMENT_TOKEN_VALUE: ${{ secrets.REPLIT_DEPLOYMENT_TOKEN }}
      REPLIT_GIT_TOKEN_VALUE: ${{ secrets.REPLIT_GIT_TOKEN }}
      REPLIT_SSH_PRIVATE_KEY_VALUE: ${{ secrets.REPLIT_SSH_PRIVATE_KEY }}
      REPLIT_SSH_HOST_VALUE: ${{ secrets.REPLIT_SSH_HOST }}
      REPLIT_SSH_USER_VALUE: ${{ secrets.REPLIT_SSH_USER }}
      REPLIT_HOST_VAR: ${{ vars.REPLIT_SSH_HOST }}
      REPLIT_USER_VAR: ${{ vars.REPLIT_SSH_USER }}
    steps:
      - name: Report credential availability without exposing values
        shell: bash
        run: |
          check() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "$name=set"
            else
              echo "$name=unset"
            fi
          }
          check REPLIT_TOKEN "$REPLIT_TOKEN_VALUE"
          check REPLIT_API_TOKEN "$REPLIT_API_TOKEN_VALUE"
          check REPLIT_AUTH_TOKEN "$REPLIT_AUTH_TOKEN_VALUE"
          check REPLIT_DEPLOYMENT_TOKEN "$REPLIT_DEPLOYMENT_TOKEN_VALUE"
          check REPLIT_GIT_TOKEN "$REPLIT_GIT_TOKEN_VALUE"
          check REPLIT_SSH_PRIVATE_KEY "$REPLIT_SSH_PRIVATE_KEY_VALUE"
          check REPLIT_SSH_HOST_SECRET "$REPLIT_SSH_HOST_VALUE"
          check REPLIT_SSH_USER_SECRET "$REPLIT_SSH_USER_VALUE"
          check REPLIT_SSH_HOST_VAR "$REPLIT_HOST_VAR"
          check REPLIT_SSH_USER_VAR "$REPLIT_USER_VAR"
