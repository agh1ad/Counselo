name: Export CounselO performance assets

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-perf-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect assets and source snapshot
        shell: bash
        run: |
          mkdir -p perf-assets/images perf-assets/source/src/pages perf-assets/source/src/scripts perf-assets/source/src/lib
          cp artifacts/legal-site/public/images/optimized/counselo-region-logo.png perf-assets/images/
          cp artifacts/legal-site/public/images/optimized/counselo-platform-line-art-v1.png perf-assets/images/
          cp artifacts/legal-site/public/images/optimized/saudi-arabia-flag.jpg perf-assets/images/
          cp artifacts/legal-site/public/images/optimized/syria-flag.jpg perf-assets/images/
          cp artifacts/legal-site/public/images/optimized/uae-flag.svg perf-assets/images/
          cp artifacts/legal-site/index.html perf-assets/source/index.html
          cp artifacts/legal-site/package.json perf-assets/source/package.json
          cp artifacts/legal-site/src/index.css perf-assets/source/src/index.css
          cp artifacts/legal-site/src/entry-client.tsx perf-assets/source/src/entry-client.tsx
          cp artifacts/legal-site/src/PickerApp.tsx perf-assets/source/src/PickerApp.tsx
          cp artifacts/legal-site/src/lib/analytics.ts perf-assets/source/src/lib/analytics.ts
          cp artifacts/legal-site/src/pages/region-picker.tsx perf-assets/source/src/pages/region-picker.tsx
          cp artifacts/legal-site/src/pages/ar-region-picker.tsx perf-assets/source/src/pages/ar-region-picker.tsx
          cp artifacts/legal-site/src/scripts/prerender.ts perf-assets/source/src/scripts/prerender.ts
          curl --fail --silent --show-error --compressed \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36' \
            'https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&display=optional' \
            -o perf-assets/google-fonts.css
          find perf-assets -type f -printf '%P %s bytes\n' | sort

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: counselo-performance-assets
          path: perf-assets
