name: Apply CounselO performance hardening

on:
  push:
    branches:
      - perf/cls-complete-zero-visual-20260829
    paths:
      - ".github/workflows/apply-counselo-performance.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4
        with:
          ref: perf/cls-complete-zero-visual-20260829
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick webp

      - name: Generate visually equivalent responsive images
        shell: bash
        run: |
          set -euo pipefail
          src="artifacts/legal-site/public/images/optimized"
          out="generated-assets/images"
          mkdir -p "$out"
          convert "$src/counselo-region-logo.png" -resize 193x80 -define webp:lossless=true "$out/counselo-region-logo-193.webp"
          convert "$src/counselo-region-logo.png" -resize 386x160 -define webp:lossless=true "$out/counselo-region-logo-386.webp"
          cwebp -quiet -q 90 -m 6 -alpha_q 100 "$src/counselo-platform-line-art-v1.png" -o "$out/counselo-platform-line-art-v1.webp"
          cwebp -quiet -q 92 -m 6 "$src/saudi-arabia-flag.jpg" -resize 72 48 -o "$out/saudi-arabia-flag-72.webp"
          cwebp -quiet -q 92 -m 6 "$src/syria-flag.jpg" -resize 72 48 -o "$out/syria-flag-72.webp"

      - name: Localize exact CounselO font subsets
        shell: bash
        run: |
          set -euo pipefail
          out="generated-assets/fonts"
          mkdir -p "$out"
          font_url='https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&display=optional'
          user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          curl -fsSL -A "$user_agent" "$font_url" -o "$out/remote.css"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const dir = 'generated-assets/fonts';
          const css = fs.readFileSync(path.join(dir, 'remote.css'), 'utf8');
          const blockPattern = /\/\*\s*([^*]+?)\s*\*\/\s*(@font-face\s*\{[^}]+\})/g;
          const selected = [];
          for (const match of css.matchAll(blockPattern)) {
            const subset = match[1].trim();
            const block = match[2];
            const family = block.match(/font-family:\s*'([^']+)'/)?.[1];
            const keep = family === 'Tajawal' || ((family === 'Inter' || family === 'Playfair Display') && subset === 'latin');
            if (keep) selected.push({ subset, block });
          }
          if (selected.length !== 15) throw new Error(`Expected 15 selected font faces, found ${selected.length}`);
          const urls = [...new Set(selected.flatMap(({ block }) => [...block.matchAll(/url\((https:\/\/fonts\.gstatic\.com\/[^)]+)\)/g)].map((m) => m[1])))];
          if (urls.length !== 11) throw new Error(`Expected 11 unique font files, found ${urls.length}`);
          const names = new Map();
          for (const url of urls) {
            const filename = new URL(url).pathname.split('/').pop();
            if (!filename) throw new Error(`Cannot derive font filename from ${url}`);
            names.set(url, filename);
            execFileSync('curl', ['-fsSL', url, '-o', path.join(dir, filename)], { stdio: 'inherit' });
          }
          const localCss = selected.map(({ subset, block }) => {
            let localized = block;
            for (const [url, filename] of names) localized = localized.split(url).join(`/fonts/${filename}`);
            return `/* ${subset} */\n${localized}`;
          }).join('\n');
          fs.writeFileSync(path.join(dir, 'counselo-fonts.css'), `${localCss}\n`);
          fs.unlinkSync(path.join(dir, 'remote.css'));
          NODE

      - name: Apply source changes
        run: python3 .github/scripts/apply-counselo-performance.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply-counselo-performance.py
          rm -f .github/workflows/apply-counselo-performance.yml
          rm -f .github/workflows/generate-counselo-assets.yml
          rm -f .github/workflows/export-counselo-source.yml
          rm -rf generated-assets
          git config user.name "CounselO Performance Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete CounselO CLS and performance hardening"
          git push origin HEAD:perf/cls-complete-zero-visual-20260829
