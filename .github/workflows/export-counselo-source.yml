name: Export CounselO source snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/export-counselo-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          tar -czf counselo-source.tar.gz \
            artifacts/legal-site \
            lib \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: counselo-source-snapshot
          path: counselo-source.tar.gz
          if-no-files-found: error
