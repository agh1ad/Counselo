<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="ahgWvG0xGZzRQTcibteUzghojzVD_cxk3FxpDe3C15M" />

    <!-- Static infrastructure — identical on every route -->
    <meta name="theme-color" content="#00521a" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="CounselO" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CounselO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="alternate" type="application/rss+xml" title="CounselO Legal Updates" href="/feed.xml" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="CounselO AI content guide" />

    <!--
      Critical region-picker geometry.
      The picker is prerendered, so its desktop layout must be established before
      the application stylesheet/runtime arrives. Keeping only geometry here avoids
      a CSS-late-load snap from the source-order mobile flow into the desktop grid,
      which is especially expensive for CLS while preserving the final design.
    -->
    <style>
      html { scrollbar-gutter: stable; }
      .region-picker-hero,
      .region-picker-hero * { box-sizing: border-box; }
      .region-picker-hero { position: relative; overflow: hidden; min-height: 88svh; }
      .region-picker-hero > .relative { position: relative; width: 100%; max-width: 1380px; margin-inline: auto; }
      .region-picker-hero > .relative > :first-child { display: flex; align-items: center; justify-content: space-between; }
      .region-picker-hero > .relative > :first-child img { display: block; width: auto; aspect-ratio: 193 / 80; }
      .region-picker-hero > .relative > :nth-child(2) { display: grid; }
      .region-picker-hero > .relative > :nth-child(2) > :nth-child(2) > :nth-child(2) { display: grid; }
      .region-picker-hero > .relative > :nth-child(2) > :nth-child(2) > :nth-child(2) > a { position: relative; display: block; overflow: hidden; }
      .region-picker-hero > .relative > :nth-child(2) > :nth-child(2) > :nth-child(2) > a > :nth-child(3) { position: absolute; }
      .region-picker-hero > .relative > :nth-child(2) > :nth-child(2) > :nth-child(2) img { display: block; width: 66px; height: 44px; object-fit: cover; }

      @media (min-width: 640px) {
        .region-picker-hero > .relative > :first-child img { height: 64px; }
        .region-picker-hero > .relative > :nth-child(2) > :nth-child(2) > :nth-child(2) { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
        .region-picker-hero > .relative > :nth-child(2) > :nth-child(2) > :nth-child(2) > a { min-height: 390px; padding: 2rem; }
        .region-picker-hero > .relative > :nth-child(2) > :nth-child(2) > :nth-child(2) > a > :nth-child(3) { inset-inline: 2rem; bottom: 2rem; }
      }

      @media (min-width: 1024px) {
        .region-picker-hero { padding: 3.5rem 2rem 5rem; }
        .region-picker-hero > .relative > :first-child { min-height: 83px; margin-bottom: 2.5rem; padding: 0.75rem 1rem 1rem; }
        .region-picker-hero > .relative > :nth-child(2) { grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); align-items: center; gap: 5rem; }
        .region-picker-hero > .relative > :nth-child(2) > :nth-child(2) { padding-top: 3.5rem; }
        .region-picker-hero > .relative > :nth-child(2) > :first-child { min-width: 0; }
        .region-picker-hero > .relative > :nth-child(2) > :nth-child(2) { min-width: 0; }
      }
    </style>

    <!-- Picker-specific resource hints are injected during prerender so only
         / and /ar pay for their critical fonts and hero artwork. -->

    <!--app-head-->

  </head>
  <body>
    <!--
      In dev mode: React mounts into this empty div (createRoot).
      In production: prerender.ts injects server-rendered HTML here before
      shipping to the client; React then hydrates (hydrateRoot) without
      replacing the existing DOM, preserving the SEO-critical content.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
