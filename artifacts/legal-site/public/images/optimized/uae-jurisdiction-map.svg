    <path d="M514 62c18 10 29 27 29 47 0 24-16 45-39 53" fill="none" stroke="#f1d183" stroke-width="1.5" stroke-dasharray="4 5"/>
    <g fill="#fff" stroke="#d5aa4e" stroke-width="2">
      <circle cx="124" cy="260" r="5"/><circle cx="232" cy="278" r="5"/><circle cx="340" cy="285" r="5"/><circle cx="455" cy="279" r="5"/><circle cx="504" cy="162" r="5"/>
