    <pattern id="grid" width="54" height="47" patternUnits="userSpaceOnUse"><path d="M27 0 54 15.5v31L27 62 0 46.5v-31Z" fill="none" stroke="#c99a3b" stroke-opacity=".2"/></pattern>
    <path id="shape" d="M121 70C135 73 138 83 153 84L178 78C192 84 205 74 219 68 236 66 245 81 259 84 280 83 291 91 315 88 344 84 373 67 402 57 419 53 430 61 448 60L481 57 506 45 516 49 512 61 518 68 505 81 492 92 478 110 456 113 438 111 430 124 428 151 435 166 430 190 431 224 422 253 410 282 337 319 265 355 187 394 105 435 88 430 68 419 53 421 46 410 36 404 39 388 29 384 38 367 41 348 57 334 51 324 65 314 79 306 87 292 78 279 80 267 68 255 73 245 61 232 54 216 56 197 52 183 59 167 51 154 63 137 76 139 80 127 94 124 98 110 113 109 118 98 115 86Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#001d14" flood-opacity=".2"/></filter>
