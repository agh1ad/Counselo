<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="title desc">
  <title id="title">Stylised map of Syria</title>
  <desc id="desc">A forest green map of Syria with gold governorate lines.</desc>
  <defs>
