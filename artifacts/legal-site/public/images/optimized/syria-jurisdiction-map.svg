      <path d="M61 232 124 216 181 240 250 206 322 230 391 198 431 224"/>
      <path d="M87 292 154 286 220 315 287 281 337 319"/>
      <path d="M143 142 124 216 154 286 105 435M205 114 181 240 220 315M260 154 250 206 287 281M328 128 322 230 337 319M391 159 391 198 410 282"/>
    </g>
    <g fill="#fff" stroke="#d5aa4e" stroke-width="2"><circle cx="143" cy="142" r="5"/><circle cx="250" cy="206" r="5"/><circle cx="322" cy="230" r="5"/><circle cx="154" cy="286" r="5"/><circle cx="391" cy="198" r="5"/></g>
  </g>
